<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<title>🥋 Taekwon-Do Theory Cards</title>
<style>
:root{--ink:#101827;--muted:#64748b;--line:#e5e7eb;--bg:#f4f6f8;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef2f7,#f8fafc);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink)}
.wrap{max-width:1080px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;padding:8px 0 18px}.brand{font-weight:900;font-size:19px}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;font-weight:700;cursor:pointer}
.hero,.top{background:#101827;color:#fff;border-radius:26px;padding:28px;box-shadow:0 12px 35px #0f172a14}.hero h1{font-size:clamp(32px,6vw,52px);letter-spacing:-2px;line-height:1;margin:0 0 10px}.hero p{color:#cbd5e1;margin:0}.search{width:100%;margin-top:20px;padding:13px 15px;border:0;border-radius:14px;outline:0}
.title{font-size:18px;margin:27px 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:12px}.grade{border:1px solid var(--line);background:#fff;border-radius:18px;padding:16px;text-align:left;min-height:140px;cursor:pointer;transition:.15s}.grade:hover{transform:translateY(-2px);box-shadow:0 10px 25px #0f172a12}.belt{height:9px;border-radius:9px;margin-bottom:14px;border:1px solid #d1d5db}.white{background:#fff}.yellow,.yellow-tag{background:#facc15}.green,.green-tag{background:#22c55e}.blue,.blue-tag{background:#2563eb}.red,.red-tag{background:#dc2626}.black{background:#101827}.kup{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.6px}.grade h3{margin:4px 0 7px}.grade p{margin:0;color:var(--muted);font-size:13px}.hidden{display:none}.back{margin:3px 0 15px}
.top h1{font-size:34px;margin:4px 0}.meta{color:#cbd5e1}.facts{display:flex;flex-wrap:wrap;gap:9px;margin-top:17px}.fact{padding:8px 11px;background:#fff1;border:1px solid #fff2;border-radius:11px;font-size:13px}
.tabs{display:flex;gap:7px;overflow:auto;padding:12px;background:#fff;border:1px solid var(--line);border-top:0}.tab{border:0;background:#f1f5f9;border-radius:10px;padding:10px 13px;font-weight:800;white-space:nowrap;cursor:pointer}.tab.active{background:#101827;color:#fff}
.content{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 25px 25px;padding:23px}.content h2{margin:0 0 14px}.section{margin:0 0 22px}.section h3{font-size:16px;margin:0 0 9px}.list{display:grid;gap:8px}.item{padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:#fafafa;line-height:1.5}.item b{display:block;margin-bottom:2px}.notice{padding:14px;border:1px solid var(--line);border-radius:14px;background:#f8fafc;color:#475569}.empty{text-align:center;padding:25px;color:var(--muted)}
footer{text-align:center;color:#94a3b8;font-size:12px;padding:28px}
@media(max-width:600px){.wrap{padding:12px}.hero,.top{padding:22px;border-radius:21px}.grid{grid-template-columns:1fr 1fr;gap:9px}.grade{min-height:128px;padding:13px}.grade h3{font-size:16px}.top h1{font-size:29px}.content{padding:18px}}
</style></head><body><div class="wrap">
<header class="head"><div class="brand">🥋 Taekwon-Do Theory Cards</div><button class="btn" id="homeBtn">All Grades</button></header>
<main id="home"><section class="hero"><h1>Know your theory.</h1><p>All information from the grading cards, organised for revision.</p><input id="search" class="search" type="search" placeholder="Search a grade, technique, Korean term or topic…"></section><h2 class="title">Choose your grade</h2><div id="grid" class="grid"></div></main>
<main id="detail" class="hidden"><button class="btn back" id="back">← Back to grades</button><section><div class="top"><div class="meta" id="kup"></div><h1 id="name"></h1><div class="meta" id="pattern"></div><div class="facts" id="facts"></div></div>
<nav class="tabs"><button class="tab active" data-tab="pattern">Pattern</button><button class="tab" data-tab="techniques">Korean & Techniques</button><button class="tab" data-tab="theory">Theory & Information</button></nav><div id="content" class="content"></div></section></main>
<footer>Offline-ready • No login • No student data stored</footer></div>
<script src="data.js"></script><script>
const $=s=>document.querySelector(s),grid=$('#grid'),home=$('#home'),detail=$('#detail'),content=$('#content');let cur=null,tab='pattern';
function render(q=''){q=q.toLowerCase();let a=GRADES.filter(g=>(g.name+' '+g.kup+' '+g.pattern+' '+g.techniques.join(' ')+' '+g.theory.join(' ')).toLowerCase().includes(q));grid.innerHTML=a.map(g=>`<button class="grade" data-id="${g.id}"><div class="belt ${g.accent}"></div><div class="kup">${g.kup}</div><h3>${g.name}</h3><p>${g.pattern}${g.movements?' • '+g.movements+' movements':''}</p></button>`).join('')||'<div class="empty">No matching information found.</div>';grid.querySelectorAll('.grade').forEach(b=>b.onclick=()=>openGrade(b.dataset.id))}
function openGrade(id,t='pattern'){cur=GRADES.find(g=>g.id===id);if(!cur)return;home.classList.add('hidden');detail.classList.remove('hidden');$('#kup').textContent=cur.kup;$('#name').textContent=cur.name;$('#pattern').textContent=cur.pattern;$('#facts').innerHTML=`<div class="fact">Pattern: ${cur.pattern}</div>${cur.movements?`<div class="fact">${cur.movements} movements</div>`:'<div class="fact">Grading card</div>'}`;tab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));show();history.replaceState(null,'','#'+id)}
function list(items){return `<div class="list">${items.map(x=>`<div class="item">${x}</div>`).join('')}</div>`}
function show(){
if(tab==='pattern')content.innerHTML=`<h2>${cur.pattern}</h2><div class="notice">${cur.movements?`The grading card specifies ${cur.movements} movements for this pattern.`:'See the grading-card information below for this exercise/pattern.'}</div>`;
if(tab==='techniques')content.innerHTML=`<h2>Korean & Techniques</h2>${list(cur.techniques)}`;
if(tab==='theory')content.innerHTML=`<h2>Theory & Information</h2>${list(cur.theory)}`;
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));show()});
$('#search').oninput=e=>render(e.target.value);function goHome(){detail.classList.add('hidden');home.classList.remove('hidden');history.replaceState(null,'','#');$('#search').focus()}$('#back').onclick=goHome;$('#homeBtn').onclick=goHome;render();if(location.hash)openGrade(location.hash.slice(1));if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');
</script></body></html>
